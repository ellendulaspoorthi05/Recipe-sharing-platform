<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gather & Graze | Recipe sharing</title><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script></head><body><header><a class="brand" href="#top">✳ gather<span>&</span>graze</a><button id="open">＋ Share a recipe</button></header><main id="top"><section class="hero"><p>GOOD FOOD, PASSED AROUND</p><h1>Every recipe<br>has a <i>story.</i></h1><p>A little corner of the internet for dishes you love and people you love sharing them with.</p><a href="#discover">Pull up a chair ↓</a><img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1100&q=85" alt="Colorful fresh food"></section><section id="discover"><h2>Pull up a chair.</h2><button id="browse">Browse the recipes ↓</button><div class="filters"><input id="search" placeholder="Search recipes…"><select id="category"><option value="">All recipes</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Dessert</option><option>Snack</option></select></div><p id="status"></p><div id="recipes" class="grid"></div></section></main><dialog id="form-dialog"><form id="recipe-form"><button type="button" id="close" class="close">×</button><h2>Share your recipe</h2><label>Recipe name<input name="title" required minlength="3" maxlength="100"></label><label>Your name<input name="author" required minlength="2" maxlength="60"></label><label>Category<select name="category" required><option value="">Choose</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Dessert</option><option>Snack</option></select></label><div class="row"><label>Prep minutes<input name="prep_minutes" type="number" min="1" max="1440" value="30" required></label><label>Servings<input name="servings" type="number" min="1" max="100" value="4" required></label></div><label>Description<textarea name="description" maxlength="500"></textarea></label><label>Ingredients (one per line)<textarea name="ingredients" required></textarea></label><label>Steps (one per line)<textarea name="instructions" required></textarea></label><label>HTTPS photo URL (optional)<input name="image_url" type="url"></label><p id="error"></p><button type="submit">Share it</button></form></dialog></body></html>
